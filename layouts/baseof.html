<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="{{ .Params.description }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ with .Params.image }}{{ . }}{{ else }}https://i.imgur.com/MePj89I.png{{ end }}">

    <meta name="twitter:card" content="summary_large_image">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@1.0.15/destyle.css">
    <link rel="stylesheet" href="{{ "style.css" | relURL }}">

    <script src="{{ "app.js" | relURL }}" defer></script>

    <title>{{ .Title }} | {{ .Site.Title }}</title>
</head>

<body>

    <header class="site-header container">

        <h1 class="site-title">
            <a href="{{ "/" | relURL }}">
                {{ block "title" . }}{{ .Site.Title }}{{ end }}
            </a>
        </h1>

        <p class="site-description">日記と写真、たまに旅</p>

        <nav id="menuline" class="site-nav" aria-label="メインナビゲーション">
            <ul>
                <li class="nav-open">▼</li>

                {{ with site.GetPage "about" }}
                <li>
                    <a href="{{ .RelPermalink }}">About</a>
                </li>
                {{ end }}

                {{ with site.GetPage "archive" }}
                <li>
                    <a href="{{ .RelPermalink }}">アーカイブ</a>
                </li>
                {{ end }}
            </ul>
        </nav>

        <nav class="menu-wrapper" aria-label="追加メニュー">
            <ul>
                <li>工事中</li>
                <li>工事中</li>
                <li>工事中</li>
            </ul>
        </nav>

    </header>


    <main class="container site-main">
        {{ block "main" . }}{{ end }}
    </main>


    <footer class="container site-footer">

        <p>極小キロバイト文庫</p>

        <a href="https://www.stylemap.co.jp/">
            <img
                src="https://www.f-counter.net/j/67/1777029739/"
                alt="アクセスカウンター"
            >
        </a>

    </footer>

</body>
</html>
